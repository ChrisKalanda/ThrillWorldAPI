<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ThrillWorld - Rides</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body data-page="rides">

<header class="topbar">
  <div class="brand">ThrillWorld</div>
  <nav class="nav-links">
    <a href="/profile.html">Profile</a>
    <a href="/rides.html">Rides</a>
    <a href="/visitors.html">Visitors</a>
    <a href="/tickets.html">Tickets</a>
    <a href="/employees.html">Employees</a>
    <a href="/maintenance.html">Maintenance</a>
    <button onclick="logout()">Logout</button>
  </nav>
</header>

<main class="data-page">
  <div class="data-shell">

    <div class="page-heading">
      <h1>Rides Management</h1>
      <p>Create, browse and manage amusement park rides through the ThrillWorld API.</p>
    </div>

    <div id="messageBox" class="alert"></div>

    <section class="form-panel">
      <h2>Add Ride</h2>

      <div class="form-grid">
        <div>
          <label for="rideId">Ride ID</label>
          <input id="rideId" type="number" placeholder="Enter ride ID" />
        </div>

        <div>
          <label for="rideName">Ride Name</label>
          <input id="rideName" type="text" placeholder="Enter ride name" />
        </div>

        <div>
          <label for="rideCapacity">Capacity</label>
          <input id="rideCapacity" type="number" placeholder="Enter capacity" />
        </div>

        <div>
          <label for="rideMinHeight">Minimum Height (cm)</label>
          <input id="rideMinHeight" type="number" placeholder="Enter minimum height" />
        </div>

        <div>
          <label for="rideDuration">Duration (seconds)</label>
          <input id="rideDuration" type="number" placeholder="Enter duration" />
        </div>

        <div>
          <label for="rideStatus">Status</label>
          <select id="rideStatus">
            <option value="operational">Operational</option>
            <option value="maintenance">Maintenance</option>
            <option value="closed">Closed</option>
          </select>
        </div>

        <div>
          <label for="rideMinAge">Minimum Age</label>
          <input id="rideMinAge" type="number" placeholder="Enter minimum age" />
        </div>

        <div>
          <label for="rideIntensityLevel">Intensity Level</label>
          <select id="rideIntensityLevel">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="full">
          <label style="display:flex; align-items:center; gap:10px; font-weight:700;">
            <input id="rideIsOutdoor" type="checkbox" style="width:auto;" />
            Outdoor Ride
          </label>
        </div>
      </div>

      <div class="toolbar">
        <button onclick="createRide()">Create Ride</button>
        <button onclick="loadRides()">Refresh List</button>
      </div>
    </section>

    <section id="ridesContainer" class="card-grid"></section>

  </div>
</main>

<script src="./app.js"></script>
<script>
  requireAuth();

  async function loadRides() {
    try {
      const data = await apiGet("/rides");
      const rides = Array.isArray(data) ? data : data.rides || [];
      const container = document.getElementById("ridesContainer");

      if (!rides.length) {
        container.innerHTML = `<div class="empty-state">No rides found.</div>`;
        showBox("messageBox", "No rides found.", "success");
        return;
      }

      container.innerHTML = rides.map(ride => `
        <div class="data-card">
          <h3>${ride.name || "Unnamed Ride"}</h3>

          <p><strong>ID:</strong> ${ride.id ?? "-"}</p>
          <p><strong>Capacity:</strong> ${ride.capacity ?? "-"}</p>
          <p><strong>Minimum Height:</strong> ${ride.minHeight ?? "-"} cm</p>
          <p><strong>Duration:</strong> ${ride.duration ?? "-"} sec</p>
          <p><strong>Status:</strong> ${ride.status ?? "-"}</p>
          <p><strong>Minimum Age:</strong> ${ride.minAge ?? 0}</p>
          <p><strong>Intensity:</strong> ${ride.intensityLevel ?? "-"}</p>
          <p><strong>Outdoor:</strong> ${ride.isOutdoor ? "Yes" : "No"}</p>

          <div class="card-actions">
            <button class="btn-delete" onclick="deleteRide(${ride.id})">Delete</button>
          </div>
        </div>
      `).join("");

      showBox("messageBox", "Rides loaded successfully.", "success");
    } catch (error) {
      showBox("messageBox", error.message, "error");
    }
  }

  async function createRide() {
    try {
      const body = {
        id: Number(document.getElementById("rideId").value),
        name: document.getElementById("rideName").value.trim(),
        capacity: Number(document.getElementById("rideCapacity").value),
        minHeight: Number(document.getElementById("rideMinHeight").value),
        duration: Number(document.getElementById("rideDuration").value),
        status: document.getElementById("rideStatus").value,
        minAge: Number(document.getElementById("rideMinAge").value || 0),
        intensityLevel: document.getElementById("rideIntensityLevel").value,
        isOutdoor: document.getElementById("rideIsOutdoor").checked
      };

      if (!body.id || !body.name || !body.capacity || body.minHeight < 0 || !body.duration) {
        showBox("messageBox", "Please fill in all required fields correctly.", "error");
        return;
      }

      await apiPost("/rides", body);

      showBox("messageBox", "Ride created successfully.", "success");
      clearRideForm();
      loadRides();
    } catch (error) {
      showBox("messageBox", error.message, "error");
    }
  }

  async function deleteRide(id) {
    if (!confirm("Delete this ride?")) return;

    try {
      await apiDelete(`/rides/${id}`);
      showBox("messageBox", "Ride deleted successfully.", "success");
      loadRides();
    } catch (error) {
      showBox("messageBox", error.message, "error");
    }
  }

  function clearRideForm() {
    document.getElementById("rideId").value = "";
    document.getElementById("rideName").value = "";
    document.getElementById("rideCapacity").value = "";
    document.getElementById("rideMinHeight").value = "";
    document.getElementById("rideDuration").value = "";
    document.getElementById("rideStatus").value = "operational";
    document.getElementById("rideMinAge").value = "";
    document.getElementById("rideIntensityLevel").value = "medium";
    document.getElementById("rideIsOutdoor").checked = false;
  }

  loadRides();
</script>

</body>
</html>
