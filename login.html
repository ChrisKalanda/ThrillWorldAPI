<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThrillWorld - Login</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">ThrillWorld</div>
    <nav class="nav-links">
      <a href="./login.html">Login</a>
      <a href="./register.html">Register</a>
    </nav>
  </header>

  <main class="page-shell">
    <div class="auth-wrapper">
      <div class="auth-left">
        <div class="auth-badge">Attractions • Tickets • Access</div>
        <h1>WELCOME BACK</h1>
        <p>
          Log in to access your account and interact with the protected features
          of the ThrillWorld API platform.
        </p>
      </div>

      <div class="auth-right">
        <div class="auth-card">
          <div class="auth-logo">THRILLWORLD</div>
          <h2 class="auth-title">Login</h2>
          <p class="auth-subtitle">
            Sign in securely and continue your experience.
          </p>

          <div id="messageBox" class="alert"></div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" class="form-input" type="email" placeholder="Enter your email address" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" class="form-input" type="password" placeholder="Enter your password" />
          </div>

          <button class="btn-main" onclick="loginUser()">Sign in</button>

          <div class="auth-footer">
            Don’t have an account?
            <a href="./register.html">Create one</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.origin + "/api";

    function showMessage(message, type = "error") {
      const box = document.getElementById("messageBox");
      box.className = `alert ${type}`;
      box.textContent = message;
    }

    async function loginUser() {
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        const response = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage(data.message || "Login failed.", "error");
          return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        showMessage("Login successful. Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "./profile.html";
        }, 1000);
      } catch (error) {
        showMessage(error.message, "error");
      }
    }
  </script>
</body>
</html>
